apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1       
      maxUnavailable: 0 
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
      - name: flask-app
        image: 514080426196.dkr.ecr.us-east-2.amazonaws.com/flask-app-demo/first:V15
        ports:
        - containerPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: flask-app-svc
spec:
  selector:
    app: flask-app
  ports:
  - port: 80
    targetPort: 5000

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: appdata
data:
  key: mama-maglione-pizza

---
apiVersion: v1
kind: Secret
metadata:
  name: my-secret
type: Opaque
data:
  password: MnBpenphcw==

