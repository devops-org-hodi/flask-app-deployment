apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1       
      maxUnavailable: 0 
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.30.4-trixie-perl
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc
spec:
  selector:
    app: nginx
  ports:
  - port: 80
    targetPort: 80

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: appdata
data:
  key: mama-maglione-pizza

---
apiVersion: v1
kind: Secret
metadata:
  name: my-secret
type: Opaque
data:
  password: MnBpenphcw==

---

apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: rs-rs1
  labels:
    app: rs
spec:
  replicas: 3
  selector:
    matchLabels:
      key: rs
  template:
    metadata:
      labels:
        key: rs
    spec:
      containers:
        - name: traefik
          image: traefik/whoami
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: rs-svc
spec:
  selector:
    key: rs
  ports:
  - port: 9090
    targetPort: 80

